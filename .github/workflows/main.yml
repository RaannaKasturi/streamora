name: Build Flutter APK

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build-apk:
    name: Build and Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'  # adjust to your Flutter version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Generate timestamp and rename APK
        run: |
          DATE=$(date +'%y%m%d')
          FILENAME="StringsSocial-${DATE}-signed.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "./$FILENAME"
          echo "APK_NAME=$FILENAME" >> $GITHUB_ENV

      - name: Commit and push APK to repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK_NAME"
          git commit -m "Add $APK_NAME [skip ci]" || echo "No changes to commit"
          git push
