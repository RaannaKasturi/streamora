name: Build Flutter APK

on:
  workflow_dispatch:  # Trigger manually

jobs:
  build-apk:
    name: Build and Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (latest stable, includes latest Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # Always fetches the latest stable Flutter & Dart

      - name: Verify Dart version
        run: dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with timestamp
        run: |
          DATE=$(date +'%y%m%d')
          FILENAME="StringsSocial-${DATE}-signed.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$FILENAME"
          echo "APK_NAME=$FILENAME" >> $GITHUB_ENV

      - name: Commit and push APK to repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK_NAME"
          git commit -m "Add $APK_NAME [skip ci]" || echo "No changes to commit"
          git push
